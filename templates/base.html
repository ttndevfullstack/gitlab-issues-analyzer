<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GitLab Issues Analyzer{% endblock %}</title>
    
    <!-- Tailwind CSS via CDN (Development) -->
    <!-- For production, consider using npm build for smaller bundle size -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration for Shadcn UI Design Tokens -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                        popover: {
                            DEFAULT: "hsl(var(--popover))",
                            foreground: "hsl(var(--popover-foreground))",
                        },
                        card: {
                            DEFAULT: "hsl(var(--card))",
                            foreground: "hsl(var(--card-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    },
                },
            },
        }
    </script>
    
    <!-- Design Tokens -->
    <link href="{{ url_for('static', filename='css/design-tokens.css') }}" rel="stylesheet">
    
    <!-- Custom Component Styles -->
    <link href="{{ url_for('static', filename='css/components.css') }}" rel="stylesheet">
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-background text-foreground antialiased">
    {% block sidebar %}{% endblock %}
    
    <div class="lg:pl-64">
        {% block header %}{% endblock %}
        
        <main class="min-h-[calc(100vh-4rem)]">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <!-- HTMX for Progressive Enhancement (Optional) -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/layout.js') }}"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
