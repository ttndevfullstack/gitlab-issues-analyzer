<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Details - GitLab Issues Analyzer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='logoGradient' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23667eea;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23764ba2;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23logoGradient)' opacity='0.1'/%3E%3Cpath d='M32 12 L40 28 L24 28 Z' fill='url(%23logoGradient)'/%3E%3Cpath d='M24 28 L32 44 L16 28 Z' fill='url(%23logoGradient)' opacity='0.8'/%3E%3Cpath d='M40 28 L32 44 L48 28 Z' fill='url(%23logoGradient)' opacity='0.8'/%3E%3Cpath d='M20 40 Q24 36 28 40 T36 40' stroke='url(%23logoGradient)' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M22 46 Q26 42 30 46 T38 46' stroke='url(%23logoGradient)' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Crect x='44' y='40' width='12' height='14' rx='1' fill='url(%23logoGradient)' opacity='0.6'/%3E%3Cline x1='47' y1='43' x2='53' y2='43' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='47' y1='46' x2='53' y2='46' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='47' y1='49' x2='51' y2='49' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .header p {
            color: #666;
            font-size: 17px;
            font-weight: 400;
            margin-bottom: 20px;
        }
        
        .nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .nav a {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .nav a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        
        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-left: 12px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
            vertical-align: middle;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }
        
        .logo-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .logo-title h1 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-title p {
            margin: 0;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .card h2 {
            color: #333;
            font-size: 26px;
            margin-bottom: 25px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 12px;
            font-weight: 600;
        }
        
        .issue-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }
        
        .info-item label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        
        .info-item value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            word-break: break-word;
        }
        
        .info-item value.badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            width: fit-content;
        }
        
        .info-item value.badge.enabled {
            background: #d4edda;
            color: #155724;
        }
        
        .issue-url-link {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
            display: inline-block;
        }
        
        .issue-url-link:hover {
            text-decoration: underline;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .email-preview {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background-color: #f9f9f9;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .email-preview iframe {
            width: 100%;
            border: none;
            min-height: 500px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .status {
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 600;
        }
        
        .status.success {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="logo">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="32" cy="32" r="30" fill="url(#logoGradient)" opacity="0.1"/>
                        <path d="M32 12 L40 28 L24 28 Z" fill="url(#logoGradient)"/>
                        <path d="M24 28 L32 44 L16 28 Z" fill="url(#logoGradient)" opacity="0.8"/>
                        <path d="M40 28 L32 44 L48 28 Z" fill="url(#logoGradient)" opacity="0.8"/>
                        <path d="M20 40 Q24 36 28 40 T36 40" stroke="url(#logoGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <path d="M22 46 Q26 42 30 46 T38 46" stroke="url(#logoGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <rect x="44" y="40" width="12" height="14" rx="1" fill="url(#logoGradient)" opacity="0.6"/>
                        <line x1="47" y1="43" x2="53" y2="43" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="47" y1="46" x2="53" y2="46" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="47" y1="49" x2="51" y2="49" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="logo-title">
                    <h1>Issue Details<span class="version-badge">v{{ version }}</span></h1>
                    <p>View issue analysis and email report</p>
                </div>
            </div>
            <nav class="nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/issues">Processed Issues</a>
            </nav>
        </div>
        
        <div id="loading" class="card loading">Loading issue details...</div>
        <div id="error" class="card error" style="display: none;"></div>
        
        <div id="content" style="display: none;">
            <div class="card">
                <h2>Issue Information</h2>
                <a href="#" id="issueUrlLink" class="issue-url-link" target="_blank" style="display: none;"></a>
                <div class="issue-info" id="issueInfo">
                </div>
            </div>
            
            <div class="card">
                <h2>Actions</h2>
                <div class="actions">
                    <button class="btn btn-primary" onclick="reanalyze()">Reanalyze (No Email)</button>
                    <button class="btn btn-secondary" onclick="resend()">Resend Email</button>
                    <button class="btn btn-success" onclick="reanalyzeAndResend()">Reanalyze & Resend</button>
                </div>
                <div id="actionStatus"></div>
            </div>
            
            <div class="card">
                <h2>Email Report Preview</h2>
                <div class="email-preview" id="emailPreview">
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const issueId = {{ issue_id }};
        
        async function loadIssueDetails() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');
            
            try {
                const response = await fetch(`/api/issues/${issueId}`);
                const data = await response.json();
                
                if (response.status !== 200) {
                    throw new Error(data.error || 'Failed to load issue');
                }
                
                loading.style.display = 'none';
                error.style.display = 'none';
                content.style.display = 'block';
                
                // Display error if present
                if (data.error) {
                    const errorDiv = document.getElementById('error');
                    errorDiv.style.display = 'block';
                    errorDiv.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="font-size: 20px;">❌</span>
                            <div>
                                <strong>Analysis Error:</strong>
                                <div style="margin-top: 8px; font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.05); padding: 8px; border-radius: 4px;">
                                    ${data.error}
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // Display issue information
                const issueData = data.issue_data || {};
                const issueInfo = document.getElementById('issueInfo');
                
                // Set URL link below title
                const issueUrlLink = document.getElementById('issueUrlLink');
                if (issueData.web_url) {
                    issueUrlLink.href = issueData.web_url;
                    issueUrlLink.textContent = issueData.web_url;
                    issueUrlLink.style.display = 'inline-block';
                } else {
                    issueUrlLink.style.display = 'none';
                }
                
                // Format state with badge styling for "opened"
                const state = issueData.state || 'unknown';
                const stateCapitalized = state.charAt(0).toUpperCase() + state.slice(1);
                const stateValue = state === 'opened' 
                    ? `<value class="badge enabled">${stateCapitalized}</value>`
                    : `<value>${stateCapitalized}</value>`;
                
                issueInfo.innerHTML = `
                    <div class="info-item">
                        <label>Issue ID</label>
                        <value>#${data.issue_iid || issueId}</value>
                    </div>
                    <div class="info-item">
                        <label>Title</label>
                        <value>${issueData.title || 'Untitled'}</value>
                    </div>
                    <div class="info-item">
                        <label>State</label>
                        ${stateValue}
                    </div>
                    <div class="info-item">
                        <label>Project ID</label>
                        <value>${issueData.project_id || 'N/A'}</value>
                    </div>
                `;
                
                // Display email preview
                const emailReport = data.email_report || {};
                const emailPreview = document.getElementById('emailPreview');
                if (data.error) {
                    emailPreview.innerHTML = '<p style="color: #e74c3c; font-weight: 600;">⚠️ No email report available due to analysis error</p>';
                } else if (emailReport.html) {
                    emailPreview.innerHTML = emailReport.html;
                } else if (emailReport.text) {
                    emailPreview.innerHTML = `<pre style="white-space: pre-wrap; font-family: inherit;">${emailReport.text}</pre>`;
                } else {
                    emailPreview.innerHTML = '<p style="color: #999;">No email report available</p>';
                }
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Error loading issue: ${err.message}`;
                content.style.display = 'none';
            }
        }
        
        async function reanalyze() {
            const statusDiv = document.getElementById('actionStatus');
            statusDiv.innerHTML = '<div class="status">Reanalyzing...</div>';
            
            try {
                const response = await fetch(`/api/issues/${issueId}/reanalyze`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = '<div class="status success">Reanalysis completed successfully!</div>';
                    // Reload issue details after a short delay
                    setTimeout(loadIssueDetails, 1000);
                } else {
                    statusDiv.innerHTML = `<div class="status error">Error: ${data.error || 'Reanalysis failed'}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="status error">Error: ${err.message}</div>`;
            }
        }
        
        async function resend() {
            const statusDiv = document.getElementById('actionStatus');
            statusDiv.innerHTML = '<div class="status">Resending email...</div>';
            
            try {
                const response = await fetch(`/api/issues/${issueId}/resend`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = '<div class="status success">Email sent successfully!</div>';
                } else {
                    statusDiv.innerHTML = `<div class="status error">Error: ${data.error || 'Failed to send email'}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="status error">Error: ${err.message}</div>`;
            }
        }
        
        async function reanalyzeAndResend() {
            const statusDiv = document.getElementById('actionStatus');
            statusDiv.innerHTML = '<div class="status">Reanalyzing and sending email...</div>';
            
            try {
                const response = await fetch(`/api/issues/${issueId}/reanalyze-and-resend`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = '<div class="status success">Reanalysis completed and email sent successfully!</div>';
                    // Reload issue details after a short delay
                    setTimeout(loadIssueDetails, 1000);
                } else {
                    statusDiv.innerHTML = `<div class="status error">Error: ${data.error || 'Operation failed'}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="status error">Error: ${err.message}</div>`;
            }
        }
        
        // Load issue details on page load
        loadIssueDetails();
    </script>
</body>
</html>
