<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processed Issues - GitLab Issues Analyzer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='logoGradient' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23667eea;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23764ba2;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23logoGradient)' opacity='0.1'/%3E%3Cpath d='M32 12 L40 28 L24 28 Z' fill='url(%23logoGradient)'/%3E%3Cpath d='M24 28 L32 44 L16 28 Z' fill='url(%23logoGradient)' opacity='0.8'/%3E%3Cpath d='M40 28 L32 44 L48 28 Z' fill='url(%23logoGradient)' opacity='0.8'/%3E%3Cpath d='M20 40 Q24 36 28 40 T36 40' stroke='url(%23logoGradient)' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M22 46 Q26 42 30 46 T38 46' stroke='url(%23logoGradient)' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Crect x='44' y='40' width='12' height='14' rx='1' fill='url(%23logoGradient)' opacity='0.6'/%3E%3Cline x1='47' y1='43' x2='53' y2='43' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='47' y1='46' x2='53' y2='46' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3Cline x1='47' y1='49' x2='51' y2='49' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .header p {
            color: #666;
            font-size: 17px;
            font-weight: 400;
            margin-bottom: 20px;
        }
        
        .nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .nav a {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .nav a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        
        .nav a.active {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        
        .version-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-left: 12px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
            vertical-align: middle;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }
        
        .logo-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .logo-title h1 {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-title p {
            margin: 0;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .card h2 {
            color: #333;
            font-size: 26px;
            margin-bottom: 25px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 12px;
            font-weight: 600;
        }
        
        .issues-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .issues-table th,
        .issues-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .issues-table th {
            background-color: #f5f5f5;
            font-weight: 600;
            color: #333;
            position: sticky;
            top: 0;
        }
        
        .issues-table tr:hover {
            background-color: #f9f9f9;
        }
        
        .issues-table a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .issues-table a:hover {
            text-decoration: underline;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge.opened {
            background-color: #28a745;
            color: white;
        }
        
        .badge.closed {
            background-color: #6c757d;
            color: white;
        }
        
        .badge.unknown {
            background-color: #ffc107;
            color: #333;
        }
        
        .label {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-right: 4px;
            background-color: #e0e0e0;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background-color: #c0392b;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
        }
        
        .btn-clear-all {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .btn-clear-all:hover {
            background-color: #c0392b;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
        }
        
        .actions-cell {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-header h2 {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="logo">
                    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="32" cy="32" r="30" fill="url(#logoGradient)" opacity="0.1"/>
                        <path d="M32 12 L40 28 L24 28 Z" fill="url(#logoGradient)"/>
                        <path d="M24 28 L32 44 L16 28 Z" fill="url(#logoGradient)" opacity="0.8"/>
                        <path d="M40 28 L32 44 L48 28 Z" fill="url(#logoGradient)" opacity="0.8"/>
                        <path d="M20 40 Q24 36 28 40 T36 40" stroke="url(#logoGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <path d="M22 46 Q26 42 30 46 T38 46" stroke="url(#logoGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <rect x="44" y="40" width="12" height="14" rx="1" fill="url(#logoGradient)" opacity="0.6"/>
                        <line x1="47" y1="43" x2="53" y2="43" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="47" y1="46" x2="53" y2="46" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                        <line x1="47" y1="49" x2="51" y2="49" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="logo-title">
                    <h1>Processed Issues<span class="version-badge">v{{ version }}</span></h1>
                    <p>View all issues that have been analyzed and processed</p>
                </div>
            </div>
            <nav class="nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/issues" class="active">Processed Issues</a>
            </nav>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2>Issues List</h2>
                <button class="btn btn-clear-all" id="clearAllBtn" onclick="clearAllIssues()" style="display: none;">
                    Clear All
                </button>
            </div>
            <div id="loading" class="loading">Loading issues...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="empty" class="empty" style="display: none;">
                <div class="empty-icon">📭</div>
                <h3>No processed issues found</h3>
                <p>Issues will appear here after they are analyzed.</p>
            </div>
            <table class="issues-table" id="issuesTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Issue ID</th>
                        <th>Title</th>
                        <th>State</th>
                        <th>Labels</th>
                        <th>Project ID</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="issuesTableBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadIssues() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const empty = document.getElementById('empty');
            const table = document.getElementById('issuesTable');
            const tbody = document.getElementById('issuesTableBody');
            
            try {
                const response = await fetch('/api/issues');
                const data = await response.json();
                
                loading.style.display = 'none';
                error.style.display = 'none';
                
                if (!data.issues || data.issues.length === 0) {
                    empty.style.display = 'block';
                    table.style.display = 'none';
                    return;
                }
                
                empty.style.display = 'none';
                table.style.display = 'table';
                
                // Show/hide clear all button based on whether there are issues
                const clearAllBtn = document.getElementById('clearAllBtn');
                if (clearAllBtn) {
                    clearAllBtn.style.display = data.issues && data.issues.length > 0 ? 'block' : 'none';
                }
                
                tbody.innerHTML = '';
                data.issues.forEach(issue => {
                    const row = document.createElement('tr');
                    
                    const stateClass = issue.state === 'opened' ? 'opened' : 
                                     issue.state === 'closed' ? 'closed' : 'unknown';
                    const stateBadge = `<span class="badge ${stateClass}">${issue.state || 'unknown'}</span>`;
                    
                    const labelsHtml = issue.labels && issue.labels.length > 0
                        ? issue.labels.map(label => {
                            const labelName = typeof label === 'string' ? label : label.name || label;
                            return `<span class="label">${labelName}</span>`;
                        }).join('')
                        : '<span style="color: #999;">None</span>';
                    
                    // Add error badge if issue has an error
                    const errorBadge = issue.has_error 
                        ? `<span class="badge" style="background-color: #e74c3c; color: white; margin-left: 8px;" title="${(issue.error || 'Analysis error').replace(/"/g, '&quot;')}">❌ Error</span>`
                        : '';
                    
                    const viewLink = `<a href="/issues/${issue.issue_id}" class="btn" style="background-color: #667eea; color: white;">View</a>`;
                    const deleteBtn = `<button class="btn btn-danger" onclick="deleteIssue(${issue.issue_id}, '${(issue.title || 'Untitled').replace(/'/g, "\\'")}')">Delete</button>`;
                    
                    row.innerHTML = `
                        <td>#${issue.issue_iid || issue.issue_id}${errorBadge}</td>
                        <td>
                            ${issue.web_url 
                                ? `<a href="${issue.web_url}" target="_blank">${issue.title || 'Untitled'}</a>`
                                : issue.title || 'Untitled'}
                        </td>
                        <td>${stateBadge}</td>
                        <td>${labelsHtml}</td>
                        <td>${issue.project_id || 'N/A'}</td>
                        <td>
                            <div class="actions-cell">
                                ${viewLink}
                                ${deleteBtn}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Error loading issues: ${err.message}`;
                table.style.display = 'none';
                empty.style.display = 'none';
            }
        }
        
        async function deleteIssue(issueId, issueTitle) {
            if (!confirm(`Are you sure you want to delete issue #${issueId} "${issueTitle}"?\n\nThis will remove it from the cache and it will need to be re-analyzed.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/issues/${issueId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Reload the issues list
                    loadIssues();
                } else {
                    alert(`Error: ${data.error || 'Failed to delete issue'}`);
                }
            } catch (err) {
                alert(`Error deleting issue: ${err.message}`);
            }
        }
        
        async function clearAllIssues() {
            if (!confirm('Are you sure you want to clear ALL cached issues?\n\nThis action cannot be undone. All issues will need to be re-analyzed.')) {
                return;
            }
            
            try {
                const response = await fetch('/api/issues', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Reload the issues list
                    loadIssues();
                } else {
                    alert(`Error: ${data.error || 'Failed to clear all issues'}`);
                }
            } catch (err) {
                alert(`Error clearing all issues: ${err.message}`);
            }
        }
        
        // Load issues on page load
        loadIssues();
        
        // Auto-refresh every 30 seconds
        setInterval(loadIssues, 30000);
    </script>
</body>
</html>
