<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processed Issues - GitLab Issues Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .header p {
            color: #666;
            font-size: 17px;
            font-weight: 400;
            margin-bottom: 20px;
        }
        
        .nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .nav a {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .nav a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }
        
        .nav a.active {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(102, 126, 234, 0.1);
        }
        
        .card h2 {
            color: #333;
            font-size: 26px;
            margin-bottom: 25px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 12px;
            font-weight: 600;
        }
        
        .issues-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .issues-table th,
        .issues-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .issues-table th {
            background-color: #f5f5f5;
            font-weight: 600;
            color: #333;
            position: sticky;
            top: 0;
        }
        
        .issues-table tr:hover {
            background-color: #f9f9f9;
        }
        
        .issues-table a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .issues-table a:hover {
            text-decoration: underline;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge.opened {
            background-color: #28a745;
            color: white;
        }
        
        .badge.closed {
            background-color: #6c757d;
            color: white;
        }
        
        .badge.unknown {
            background-color: #ffc107;
            color: #333;
        }
        
        .label {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            margin-right: 4px;
            background-color: #e0e0e0;
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Processed Issues</h1>
            <p>View all issues that have been analyzed and processed</p>
            <nav class="nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/issues" class="active">Processed Issues</a>
            </nav>
        </div>
        
        <div class="card">
            <h2>Issues List</h2>
            <div id="loading" class="loading">Loading issues...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="empty" class="empty" style="display: none;">
                <div class="empty-icon">📭</div>
                <h3>No processed issues found</h3>
                <p>Issues will appear here after they are analyzed.</p>
            </div>
            <table class="issues-table" id="issuesTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Issue ID</th>
                        <th>Title</th>
                        <th>State</th>
                        <th>Labels</th>
                        <th>Project ID</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="issuesTableBody">
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        async function loadIssues() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const empty = document.getElementById('empty');
            const table = document.getElementById('issuesTable');
            const tbody = document.getElementById('issuesTableBody');
            
            try {
                const response = await fetch('/api/issues');
                const data = await response.json();
                
                loading.style.display = 'none';
                error.style.display = 'none';
                
                if (!data.issues || data.issues.length === 0) {
                    empty.style.display = 'block';
                    table.style.display = 'none';
                    return;
                }
                
                empty.style.display = 'none';
                table.style.display = 'table';
                
                tbody.innerHTML = '';
                data.issues.forEach(issue => {
                    const row = document.createElement('tr');
                    
                    const stateClass = issue.state === 'opened' ? 'opened' : 
                                     issue.state === 'closed' ? 'closed' : 'unknown';
                    const stateBadge = `<span class="badge ${stateClass}">${issue.state || 'unknown'}</span>`;
                    
                    const labelsHtml = issue.labels && issue.labels.length > 0
                        ? issue.labels.map(label => {
                            const labelName = typeof label === 'string' ? label : label.name || label;
                            return `<span class="label">${labelName}</span>`;
                        }).join('')
                        : '<span style="color: #999;">None</span>';
                    
                    const viewLink = `<a href="/issues/${issue.issue_id}">View</a>`;
                    
                    row.innerHTML = `
                        <td>#${issue.issue_iid || issue.issue_id}</td>
                        <td>
                            ${issue.web_url 
                                ? `<a href="${issue.web_url}" target="_blank">${issue.title || 'Untitled'}</a>`
                                : issue.title || 'Untitled'}
                        </td>
                        <td>${stateBadge}</td>
                        <td>${labelsHtml}</td>
                        <td>${issue.project_id || 'N/A'}</td>
                        <td>${viewLink}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Error loading issues: ${err.message}`;
                table.style.display = 'none';
                empty.style.display = 'none';
            }
        }
        
        // Load issues on page load
        loadIssues();
        
        // Auto-refresh every 30 seconds
        setInterval(loadIssues, 30000);
    </script>
</body>
</html>
